<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <style>
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .background-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .layer1 { z-index: 1; }
        .layer2 { z-index: 2; }
        .layer3 { z-index: 3; }
        #game-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            z-index: 10;
        }
        .game-header {
            position: absolute;
            top: 20px;
            width: 100%;
            z-index: 20;
            color: #FFD700;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.8);
            font-size: 2rem;
            letter-spacing: 3px;
            text-align: center;
            pointer-events: none;
            font-family: 'Press Start 2P', cursive;
        }
        .back-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF5722, #FF9800);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
        .back-button:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a2e;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        #loading-screen p {
            color: #FFD700;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            letter-spacing: 3px;
            animation: blink 1s step-start infinite;
        }
        .loading-bar-wrapper {
            width: 200px;
            height: 16px;
            background: #333;
            border: 2px solid #FFD700;
            border-radius: 8px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF5722, #FFD700);
            border-radius: 8px;
            animation: load 2s ease-out forwards;
        }
        @keyframes load {
            0%   { width: 0%; }
            60%  { width: 70%; }
            90%  { width: 90%; }
            100% { width: 100%; }
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="game-page">

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <p>YÜKLENİYOR...</p>
        <div class="loading-bar-wrapper">
            <div class="loading-bar"></div>
        </div>
    </div>

    <div class="game-header"></div>
    
    <div class="game-container">
        <img src="./assets/tema/background/background_0.png" class="background-layer layer1">
        <img src="./assets/tema/background/background_1.png" class="background-layer layer2">
        <img src="./assets/tema/background/background_2.png" class="background-layer layer3">
        
        <iframe 
            id="game-frame"
            src="./build/web/index.html" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        document.getElementById('game-frame').addEventListener('load', function() {
            console.log("Oyun başarıyla yüklendi!");

            // Loading screen'i kaldır
            setTimeout(function() {
                var loading = document.getElementById('loading-screen');
                loading.style.transition = 'opacity 0.5s';
                loading.style.opacity = '0';
                setTimeout(function() { loading.style.display = 'none'; }, 500);
            }, 500);

            document.querySelectorAll('.background-layer').forEach(img => {
                img.onerror = function() {
                    console.warn("Arka plan resmi yüklenemedi: ", this.src);
                    this.style.display = 'none';
                };
            });
        });

        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.body.classList.add('mobile');
        }
    </script>
</body>
</html>
