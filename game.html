<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump Rabbit</title>
    <link rel="stylesheet" href="./style.css">
    <style>
       
        body, html { margin: 0; padding: 0; background-color: #000; }
        
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .background-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .layer1 { z-index: 1; }
        .layer2 { z-index: 2; }
        .layer3 { z-index: 3; }
        
        #game-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            z-index: 10;
        }

      
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #154c79;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        #loading-text {
            color: #FFD700;
            font-family: 'Press Start 2P', monospace, sans-serif;
            font-size: 1rem;
            letter-spacing: 3px;
            animation: blink 1.5s step-start infinite;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }
        .loading-bar-wrapper {
            width: 250px;
            height: 16px;
            background: #333;
            border: 2px solid #FFD700;
            border-radius: 8px;
            overflow: hidden;
        }
       
        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF5722, #FFD700);
            border-radius: 8px;
            animation: load 15s ease-out forwards;
        }

        @keyframes load {
            0%   { width: 0%; }
            20%  { width: 30%; }
            60%  { width: 70%; }
            80%  { width: 90%; }
            100% { width: 100%; }
        }
        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="game-page">

    
    <div id="loading-screen">
        <p id="loading-text">OYUN MOTORU YÜKLENİYOR...</p>
        <div class="loading-bar-wrapper">
            <div class="loading-bar"></div>
        </div>
    </div>
    
    <div class="game-container">
       
        <img src="./assets/tema/background/background_0.png" class="background-layer layer1" alt="bg0">
        <img src="./assets/tema/background/background_1.png" class="background-layer layer2" alt="bg1">
        <img src="./assets/tema/background/background_2.png" class="background-layer layer3" alt="bg2">
        
       
        <iframe 
            id="game-frame"
            src="./build/web/index.html" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');

        
        document.getElementById('game-frame').addEventListener('load', function() {
            console.log("Iframe yapısı kuruldu, Python dosyalarının inmesi bekleniyor...");
        });

       
        setTimeout(function() {
            if(loadingScreen.style.display !== 'none') {
                loadingText.innerText = "BİRAZ ZAMAN ALABİLİR, BEKLENİYOR...";
            }
        }, 8000);

        
        setTimeout(function() {
            loadingScreen.style.transition = 'opacity 0.8s ease';
            loadingScreen.style.opacity = '0';
            
            setTimeout(function() { 
                loadingScreen.style.display = 'none'; 
            }, 800);
            
        }, 15000);

       
        if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.body.classList.add('mobile');
        }
    </script>
</body>
</html>
